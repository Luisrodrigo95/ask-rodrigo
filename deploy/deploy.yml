name: CI/CD Pipeline & Automated Security Verification

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # -------------------------------------------------------------
  # Job 1: Security Scan, Prompt Armor & Threat Mitigation Tests
  # -------------------------------------------------------------
  security-and-tests:
    name: 🛡️ Security Audit & Tri-Guard Defense Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'server/package-lock.json'

      - name: Install Server Dependencies
        run: |
          cd server
          npm ci

      - name: Run Tri-Guard Prompt Defense Automated Verification Suite
        run: |
          npm run test:security

      - name: Verify No Secrets Committed in Codebase
        run: |
          echo "Scanning tracked files for potential API keys or private certificates..."
          ! git grep -iE '(AIza[0-9A-Za-z-_]{35}|sk-[A-Za-z0-9]{32,}|BEGIN [A-Z]+ PRIVATE KEY)' -- ':!server/scripts/verify-prompt-armor.js'

  # -------------------------------------------------------------
  # Job 2: Client Build & Asset Compilation
  # -------------------------------------------------------------
  build-frontend:
    name: 📦 Frontend Build & Bundle Verification
    runs-on: ubuntu-latest
    needs: security-and-tests
    steps:
      - name: Checkout Code Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies
        run: |
          cd client
          npm ci

      - name: Build Production Assets (Vite)
        run: |
          cd client
          npm run build

  # -------------------------------------------------------------
  # Job 3: Zero-Downtime Production Deployment
  # -------------------------------------------------------------
  deploy-to-vps:
    name: 🚀 Zero-Downtime VPS Deployment & PM2 Reload
    runs-on: ubuntu-latest
    needs: [security-and-tests, build-frontend]
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    steps:
      - name: Deploy to Debian 13 VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        if: env.SSH_HOST != ''
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER || 'bombi' }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script_stop: true
          script: |
            echo "--- 1. Pulling latest code from origin/master ---"
            cd /var/www/ask-rodrigo
            git fetch origin master
            git reset --hard origin/master

            echo "--- 2. Building frontend client assets ---"
            npm --prefix client run build

            echo "--- 3. Graceful PM2 Cluster Reload ---"
            sudo -n pm2 reload ask-rodrigo --update-env

            echo "--- 4. Production Health Verification ---"
            curl -sf http://127.0.0.1:3005/api/health || exit 1
            echo "Deployment successfully verified!"
